<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AnimoNexus – Create User</title>

  <style>
    :root{
      --green:#006633;
      --green-light:#007a33;
      --green-lighter:#00cc66;
      --page-bg:#e6f2e6;
    }
    body{
      margin:0;font-family:Arial,Helvetica,sans-serif;
      background:var(--page-bg);color:#004d00;
      display:flex;flex-direction:column;min-height:100vh;
    }

    /* header */
    .page-heading{
      background:var(--green);color:#fff;
      display:flex;justify-content:space-between;align-items:center;
      padding:15px 90px 15px 100px;
    }
    .branding{display:flex;align-items:center;gap:14px}
    .branding img.logo{height:48px;filter:invert(1);}      /* WHITE logo */
    .branding h1{margin:0;font-size:2rem}

    .page-heading a{
      background:linear-gradient(to right,var(--green-light),var(--green-lighter));
      color:#fff;text-decoration:none;font-weight:bold;
      padding:8px 30px;border-radius:5px;transition:.2s;
    }
    .page-heading a:hover{box-shadow:0 0 10px var(--green-lighter)}

    /* card */
    .card{
      background:rgba(0,0,0,.35);
      margin:auto;padding:40px 50px;border-radius:8px;
      box-shadow:0 4px 8px rgba(0,0,0,.15);
      width:320px;text-align:center;
    }
    .card h2{color:#fff;margin:0 0 25px}
    .card input{
      width:100%;padding:10px;margin:8px 0;
      border:1px solid #606060;border-radius:4px;
      background:rgba(255,255,255,.1);color:#fff;
    }
    .card button{
      width:100%;padding:10px;margin-top:10px;border:none;border-radius:4px;
      background:var(--green-light);color:#fff;font-weight:bold;cursor:pointer;transition:.15s;
    }
    .card button:hover{background:var(--green)}

    /* mini login button */
    .mini-btn{
      display:inline-block;margin-top:14px;
      background:var(--green-light);color:#fff;text-decoration:none;
      padding:6px 24px;border-radius:4px;font-size:.9rem;font-weight:bold;transition:.15s;
    }
    .mini-btn:hover{background:var(--green)}
  </style>
</head>
<body>

  <!-- header -->
  <header class="page-heading">
    <div class="branding">
      <img src="static/images/animonexus_logo.png" alt="AnimoNexus logo" class="logo">
      <h1>AnimoNexus</h1>
    </div>
    <a href="index.php">Home</a>
  </header>

  <!-- create-user form -->
  <form class="card" action="register.php" method="post">
    <h2>Create an account</h2>

    <input type="text"     name="username" placeholder="Username" required>
    <input type="email"    name="email"    placeholder="Email"    required>
    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Create User</button>

    <p style="margin-top:18px;color:#fff;font-size:.9rem">
      Already have an account?
    </p>
    <a href="login.php" class="mini-btn">Login</a>
  </form>

</body>
</html>
