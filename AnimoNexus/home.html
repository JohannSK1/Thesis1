<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AnimoNexus</title>
  <link rel="icon" type="image/x-icon" href="">
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root{
      --green:#006633;--green-light:#007a33;--green-lighter:#00cc66;
      --page-bg:#e6f2e6;
    }
    body{
      margin:0;font-family:Arial,Helvetica,sans-serif;
      background:var(--page-bg);color:#004d00;
      display:flex;flex-direction:column;min-height:100vh;
    }

    /* header */
    .page-heading{
      background:var(--green);color:#fff;
      display:flex;justify-content:space-between;align-items:center;
      padding:15px 90px 15px 100px;
    }
    .branding{display:flex;align-items:center;gap:14px}
    .branding img.logo{height:48px;filter:invert(1);}   /* WHITE logo */
    .branding h1{margin:0;font-size:2rem}

    .page-heading a{
      background:linear-gradient(to right,var(--green-light),var(--green-lighter));
      color:#fff;text-decoration:none;font-weight:bold;
      padding:8px 30px;border-radius:5px;transition:.2s;
    }
    .page-heading a:hover{box-shadow:0 0 10px var(--green-lighter)}

    /* tagline */
    h2{text-align:center;margin:100px auto 60px;font-size:1.5rem;font-weight:normal}

    /* buttons */
    .button-container{display:flex;gap:40px;justify-content:center;flex-wrap:wrap}
    .button-container form{margin:0}
    .button-container button{
      background:linear-gradient(to right,var(--green-light),var(--green-lighter));
      border:none;color:#fff;padding:12px 40px;border-radius:6px;
      font-size:1rem;font-weight:bold;cursor:pointer;transition:.18s;
    }
    .button-container button:hover{box-shadow:0 0 10px var(--green-lighter)}
  </style>
</head>
<body>

  <!-- header -->
  <header class="page-heading">
    <div class="branding">
      <img src="static/images/animonexus_logo.png" alt="AnimoNexus logo" class="logo">
      <h1>AnimoNexus</h1>
    </div>
    <a href="login.html">Login</a>
  </header>

  <!-- tagline -->
  <h2>Welcome to AnimoNexus, DLSU-D Research Repository System</h2>

  <!-- three original buttons -->
  <div class="button-container">
    <form action="user.html"   method="get"><button>User</button></form>
    <form action="admin.html"  method="get"><button>Admin</button></form>
    <form action="create_user.html" method="get"><button>Create&nbsp;User</button></form>
  </div>

</body>
</html>
